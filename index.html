<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claude Code Knowledge Graph</title>
<style>
  /* Charter font - use local if available, fallback to Georgia */
  @font-face {
    font-family: 'Charter';
    src: local('Charter'), local('Charter-Regular'), local('Bitstream Charter');
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: 'Charter';
    src: local('Charter Bold'), local('Charter-Bold'), local('Bitstream Charter Bold');
    font-weight: 700;
    font-style: normal;
    font-display: swap;
  }

  :root {
    --bg: #FAFAFA;
    --bg-secondary: #FFFFFF;
    --text: #1A1A1A;
    --text-secondary: #666666;
    --text-muted: #999999;
    --border: #E5E5E5;
    --node-stroke: #D0D0D0;
    --link-color: #D0D0D0;
    --hover-bg: #F0F0F0;
    --panel-bg: #FFFFFF;
    --panel-shadow: rgba(0,0,0,0.08);
    --search-bg: #FFFFFF;
    --badge-bg: #F0F0F0;
    --scrollbar-thumb: #CCC;
    --scrollbar-track: transparent;

    --color-concepts: #9B7ED8;
    --color-concepts-bg: #F0EBF8;
    --color-tips: #4CAF7D;
    --color-tips-bg: #E8F5E9;
    --color-workflows: #5B9BD5;
    --color-workflows-bg: #E3F0FB;
    --color-reports: #E6913E;
    --color-reports-bg: #FFF3E0;
    --color-hot: #E05A8D;
    --color-hot-bg: #FCE4EC;
    --color-orchestration: #7E8FA6;
    --color-orchestration-bg: #ECEFF3;
    --color-root: #333333;
    --color-root-bg: #F5F5F5;
    --color-default: #888888;
    --color-default-bg: #F5F5F5;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141420;
      --bg-secondary: #1C1C2E;
      --text: #E8E8E8;
      --text-secondary: #9A9AB0;
      --text-muted: #6A6A80;
      --border: #2A2A40;
      --node-stroke: #3A3A5C;
      --link-color: #2E2E4A;
      --hover-bg: #22223A;
      --panel-bg: #1C1C2E;
      --panel-shadow: rgba(0,0,0,0.4);
      --search-bg: #1C1C2E;
      --badge-bg: #2A2A40;
      --scrollbar-thumb: #3A3A5C;
      --scrollbar-track: transparent;

      --color-concepts: #9B7ED8;
      --color-concepts-bg: #2A2040;
      --color-tips: #34D399;
      --color-tips-bg: #1A2E28;
      --color-workflows: #60A5FA;
      --color-workflows-bg: #1A2440;
      --color-reports: #FB923C;
      --color-reports-bg: #2E2218;
      --color-hot: #F472B6;
      --color-hot-bg: #2E1A28;
      --color-orchestration: #94A3B8;
      --color-orchestration-bg: #1E2430;
      --color-root: #E8E8E8;
      --color-root-bg: #2A2A40;
      --color-default: #9A9AB0;
      --color-default-bg: #22223A;
    }
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Charter', 'Georgia', 'Times New Roman', serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
    height: 100vh;
    width: 100vw;
  }

  h1, h2, h3, h4, h5, h6, .title-font {
    font-family: 'Helvetica Neue', 'Helvetica', 'Arial', sans-serif;
    font-weight: 500;
    letter-spacing: -0.01em;
  }

  /* Header */
  #header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 56px;
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    z-index: 100;
  }

  #header h1 {
    font-size: 18px;
    font-weight: 600;
    color: var(--text);
  }

  #header h1 span {
    color: var(--text-muted);
    font-weight: 400;
  }

  #search-container {
    position: relative;
    width: 280px;
  }

  #search {
    width: 100%;
    padding: 8px 12px 8px 34px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--search-bg);
    color: var(--text);
    font-family: 'Charter', 'Georgia', serif;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }

  #search:focus { border-color: var(--color-concepts); }

  #search-icon {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    font-size: 14px;
    pointer-events: none;
  }

  #controls {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .btn {
    padding: 6px 14px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg-secondary);
    color: var(--text-secondary);
    font-family: 'Helvetica Neue', 'Helvetica', sans-serif;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }

  .btn:hover { background: var(--hover-bg); color: var(--text); }

  #last-updated {
    font-size: 12px;
    color: var(--text-muted);
    margin-right: 8px;
  }

  /* Legend */
  #legend {
    position: fixed;
    bottom: 20px;
    left: 24px;
    display: flex;
    gap: 14px;
    z-index: 50;
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 16px;
    font-size: 12px;
    font-family: 'Helvetica Neue', 'Helvetica', sans-serif;
    color: var(--text-secondary);
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
  }

  /* SVG Graph */
  #graph-container {
    position: fixed;
    top: 56px;
    left: 0;
    right: 0;
    bottom: 0;
    overflow: hidden;
  }

  svg {
    width: 100%;
    height: 100%;
  }

  .node { cursor: pointer; }

  .node circle {
    stroke-width: 2;
    transition: all 0.2s;
  }

  .node:hover circle {
    stroke-width: 3;
    filter: drop-shadow(0 0 4px rgba(0,0,0,0.15));
  }

  .node text {
    font-family: 'Helvetica Neue', 'Helvetica', sans-serif;
    font-size: 13px;
    fill: var(--text);
    pointer-events: none;
  }

  .node .node-count {
    font-size: 10px;
    fill: var(--text-muted);
  }

  .link {
    fill: none;
    stroke: var(--link-color);
    stroke-width: 1.5;
  }

  .node.search-match circle {
    stroke-width: 3;
    filter: drop-shadow(0 0 8px rgba(155, 126, 216, 0.5));
  }

  .node.search-dim { opacity: 0.15; }
  .link.search-dim { opacity: 0.08; }

  /* Breadcrumb */
  #breadcrumb {
    position: fixed;
    top: 64px;
    left: 24px;
    font-family: 'Helvetica Neue', 'Helvetica', sans-serif;
    font-size: 13px;
    color: var(--text-muted);
    z-index: 50;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  #breadcrumb span { cursor: pointer; }
  #breadcrumb span:hover { color: var(--text); }
  #breadcrumb .sep { color: var(--text-muted); cursor: default; }
  #breadcrumb .current { color: var(--text-secondary); cursor: default; }

  /* Side Panel */
  #panel {
    position: fixed;
    top: 56px;
    right: 0;
    width: 420px;
    height: calc(100vh - 56px);
    background: var(--panel-bg);
    border-left: 1px solid var(--border);
    box-shadow: -4px 0 20px var(--panel-shadow);
    transform: translateX(100%);
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 90;
    overflow-y: auto;
    padding: 28px;
  }

  #panel.open { transform: translateX(0); }

  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-track { background: var(--scrollbar-track); }
  #panel::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 3px; }

  #panel-close {
    position: absolute;
    top: 16px;
    right: 16px;
    width: 28px;
    height: 28px;
    border: none;
    background: var(--hover-bg);
    border-radius: 6px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-secondary);
    font-size: 16px;
    transition: all 0.15s;
  }

  #panel-close:hover { background: var(--border); color: var(--text); }

  #panel .panel-category {
    display: inline-block;
    font-family: 'Helvetica Neue', 'Helvetica', sans-serif;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    padding: 3px 10px;
    border-radius: 4px;
    margin-bottom: 12px;
  }

  #panel .panel-title {
    font-size: 22px;
    font-weight: 600;
    margin-bottom: 8px;
    line-height: 1.3;
  }

  #panel .panel-subtitle {
    font-size: 14px;
    color: var(--text-secondary);
    margin-bottom: 20px;
    line-height: 1.5;
  }

  #panel .panel-section {
    margin-bottom: 20px;
  }

  #panel .panel-section-title {
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    margin-bottom: 8px;
  }

  #panel .panel-content {
    font-size: 15px;
    line-height: 1.7;
    color: var(--text);
  }

  #panel .panel-content p {
    margin-bottom: 12px;
  }

  #panel .panel-content ul {
    padding-left: 20px;
    margin-bottom: 12px;
  }

  #panel .panel-content li {
    margin-bottom: 6px;
    line-height: 1.6;
  }

  #panel .panel-content code {
    font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
    font-size: 13px;
    background: var(--badge-bg);
    padding: 2px 6px;
    border-radius: 4px;
  }

  #panel .panel-content pre {
    background: var(--badge-bg);
    padding: 14px;
    border-radius: 8px;
    overflow-x: auto;
    margin-bottom: 12px;
    font-size: 13px;
    line-height: 1.5;
  }

  #panel .panel-content pre code {
    background: none;
    padding: 0;
  }

  #panel .panel-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--color-concepts);
    text-decoration: none;
    font-family: 'Helvetica Neue', 'Helvetica', sans-serif;
    font-size: 13px;
    padding: 6px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    margin-right: 8px;
    margin-bottom: 8px;
    transition: all 0.15s;
  }

  #panel .panel-link:hover {
    background: var(--hover-bg);
    border-color: var(--color-concepts);
  }

  #panel .panel-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 8px;
  }

  #panel .panel-tag {
    font-family: 'Helvetica Neue', 'Helvetica', sans-serif;
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 4px;
    background: var(--badge-bg);
    color: var(--text-secondary);
  }

  /* Keyboard hint */
  #keyboard-hint {
    position: fixed;
    bottom: 20px;
    right: 24px;
    font-family: 'Helvetica Neue', 'Helvetica', sans-serif;
    font-size: 11px;
    color: var(--text-muted);
    z-index: 50;
    display: flex;
    gap: 12px;
  }

  .kbd {
    display: inline-block;
    padding: 1px 5px;
    border: 1px solid var(--border);
    border-radius: 3px;
    font-size: 11px;
    background: var(--bg-secondary);
  }

  /* Tooltip */
  #tooltip {
    position: fixed;
    pointer-events: none;
    background: var(--panel-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 13px;
    max-width: 280px;
    box-shadow: 0 4px 12px var(--panel-shadow);
    z-index: 200;
    opacity: 0;
    transition: opacity 0.15s;
  }

  #tooltip.visible { opacity: 1; }

  #tooltip .tooltip-title {
    font-family: 'Helvetica Neue', 'Helvetica', sans-serif;
    font-weight: 600;
    font-size: 13px;
    margin-bottom: 4px;
  }

  #tooltip .tooltip-desc {
    font-size: 12px;
    color: var(--text-secondary);
    line-height: 1.4;
  }

  #tooltip .tooltip-hint {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 6px;
  }
</style>
</head>
<body>

<div id="header">
  <h1>Claude Code <span>Knowledge Graph</span></h1>
  <div id="search-container">
    <span id="search-icon">&#x2315;</span>
    <input id="search" type="text" placeholder="Search concepts, tips, workflows..." />
  </div>
  <div id="controls">
    <span id="last-updated"></span>
    <button class="btn" id="btn-expand-all">Expand All</button>
    <button class="btn" id="btn-collapse-all">Collapse</button>
    <button class="btn" id="btn-fit">Fit View</button>
  </div>
</div>

<div id="breadcrumb"></div>

<div id="graph-container">
  <svg id="svg"></svg>
</div>

<div id="panel">
  <button id="panel-close">&times;</button>
  <div id="panel-body"></div>
</div>

<div id="legend">
  <div class="legend-item"><div class="legend-dot" style="background:var(--color-concepts)"></div>Concepts</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--color-tips)"></div>Tips</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--color-workflows)"></div>Workflows</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--color-reports)"></div>Reports</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--color-hot)"></div>Hot</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--color-orchestration)"></div>Orchestration</div>
</div>

<div id="keyboard-hint">
  <span><span class="kbd">Esc</span> close panel</span>
  <span><span class="kbd">/</span> search</span>
  <span><span class="kbd">F</span> fit view</span>
</div>

<div id="tooltip">
  <div class="tooltip-title"></div>
  <div class="tooltip-desc"></div>
  <div class="tooltip-hint"></div>
</div>

<script src="https://d3js.org/d3.v7.min.js"></script>

const LAST_UPDATED = "2026-03-30";

// ─── COLOR MAPPING ──────────────────────────────────────────────────────────
function getColor(category) {
  const map = {
    root: 'var(--color-root)',
    concepts: 'var(--color-concepts)',
    tips: 'var(--color-tips)',
    workflows: 'var(--color-workflows)',
    reports: 'var(--color-reports)',
    hot: 'var(--color-hot)',
    orchestration: 'var(--color-orchestration)'
  };
  return map[category] || 'var(--color-default)';
}

function getBgColor(category) {
  const map = {
    root: 'var(--color-root-bg)',
    concepts: 'var(--color-concepts-bg)',
    tips: 'var(--color-tips-bg)',
    workflows: 'var(--color-workflows-bg)',
    reports: 'var(--color-reports-bg)',
    hot: 'var(--color-hot-bg)',
    orchestration: 'var(--color-orchestration-bg)'
  };
  return map[category] || 'var(--color-default-bg)';
}

// ─── TREE VISUALIZATION ─────────────────────────────────────────────────────
const svg = d3.select('#svg');
const g = svg.append('g');
const margin = { top: 30, right: 200, bottom: 30, left: 120 };

let root, treemap, i = 0, duration = 400;
let currentSearch = '';

// Zoom behavior
const zoom = d3.zoom()
  .scaleExtent([0.2, 3])
  .on('zoom', (event) => g.attr('transform', event.transform));

svg.call(zoom);

// Build the tree
root = d3.hierarchy(KNOWLEDGE_DATA, d => d.children);
root.x0 = window.innerHeight / 2;
root.y0 = 0;

// Collapse children initially (except first level)
function collapseLevel(d, depth) {
  if (d.children && depth >= 2) {
    d._children = d.children;
    d.children = null;
  }
  if (d.children) d.children.forEach(c => collapseLevel(c, depth + 1));
  if (d._children) d._children.forEach(c => collapseLevel(c, depth + 1));
}
collapseLevel(root, 0);

update(root);
fitView();

function update(source) {
  const width = window.innerWidth;
  const height = window.innerHeight - 56;

  // Count visible nodes to set height dynamically
  let nodeCount = 0;
  root.eachBefore(() => nodeCount++);
  const dynamicHeight = Math.max(nodeCount * 28, height);

  treemap = d3.tree().size([dynamicHeight, width - margin.left - margin.right - 300]);
  const treeData = treemap(root);
  const nodes = treeData.descendants();
  const links = treeData.descendants().slice(1);

  // Horizontal spacing
  nodes.forEach(d => { d.y = d.depth * 220; });

  // ─── LINKS ──────────────────────────────────────────────────────────
  const link = g.selectAll('path.link')
    .data(links, d => d.id || (d.id = ++i));

  const linkEnter = link.enter().append('path')
    .attr('class', 'link')
    .attr('d', () => {
      const o = { x: source.x0, y: source.y0 };
      return diagonal(o, o);
    });

  const linkUpdate = linkEnter.merge(link);
  linkUpdate.transition().duration(duration)
    .attr('d', d => diagonal(d, d.parent));

  link.exit().transition().duration(duration)
    .attr('d', () => {
      const o = { x: source.x, y: source.y };
      return diagonal(o, o);
    }).remove();

  // ─── NODES ──────────────────────────────────────────────────────────
  const node = g.selectAll('g.node')
    .data(nodes, d => d.id || (d.id = ++i));

  const nodeEnter = node.enter().append('g')
    .attr('class', 'node')
    .attr('transform', () => `translate(${source.y0},${source.x0})`)
    .on('click', (event, d) => {
      event.stopPropagation();
      if (d.children || d._children) {
        toggle(d);
        update(d);
      }
      showPanel(d.data);
    })
    .on('mouseenter', (event, d) => showTooltip(event, d.data))
    .on('mouseleave', hideTooltip);

  nodeEnter.append('circle')
    .attr('r', 0)
    .style('fill', d => d._children ? getColor(d.data.category) : getBgColor(d.data.category))
    .style('stroke', d => getColor(d.data.category));

  nodeEnter.append('text')
    .attr('dy', '.35em')
    .attr('x', d => (d.children || d._children) ? -14 : 14)
    .attr('text-anchor', d => (d.children || d._children) ? 'end' : 'start')
    .text(d => d.data.name);

  // Collapse indicator (count badge)
  nodeEnter.append('text')
    .attr('class', 'node-count')
    .attr('dy', '.35em')
    .attr('x', d => (d.children || d._children) ? -14 : 14)
    .attr('text-anchor', d => (d.children || d._children) ? 'end' : 'start')
    .attr('transform', 'translate(0, 16)')
    .text(d => {
      const total = countDescendants(d);
      return total > 0 ? `${total} items` : '';
    });

  const nodeUpdate = nodeEnter.merge(node);

  nodeUpdate.transition().duration(duration)
    .attr('transform', d => `translate(${d.y},${d.x})`);

  nodeUpdate.select('circle')
    .attr('r', d => d.depth === 0 ? 10 : d._children ? 7 : 5)
    .style('fill', d => d._children ? getColor(d.data.category) : getBgColor(d.data.category))
    .style('stroke', d => getColor(d.data.category));

  nodeUpdate.select('text:not(.node-count)')
    .attr('x', d => (d.children || d._children) ? -14 : 14)
    .attr('text-anchor', d => (d.children || d._children) ? 'end' : 'start')
    .style('font-weight', d => d.depth <= 1 ? '600' : '400')
    .style('font-size', d => d.depth === 0 ? '16px' : d.depth === 1 ? '14px' : '13px');

  nodeUpdate.select('.node-count')
    .text(d => {
      if (!d._children) return '';
      const total = countDescendants(d);
      return total > 0 ? `${total} items` : '';
    });

  const nodeExit = node.exit().transition().duration(duration)
    .attr('transform', () => `translate(${source.y},${source.x})`)
    .remove();

  nodeExit.select('circle').attr('r', 0);
  nodeExit.select('text').style('fill-opacity', 0);

  // Save positions
  nodes.forEach(d => { d.x0 = d.x; d.y0 = d.y; });

  // Apply search highlighting
  if (currentSearch) applySearch(currentSearch);
}

function diagonal(s, d) {
  return `M ${s.y} ${s.x}
          C ${(s.y + d.y) / 2} ${s.x},
            ${(s.y + d.y) / 2} ${d.x},
            ${d.y} ${d.x}`;
}

function toggle(d) {
  if (d.children) {
    d._children = d.children;
    d.children = null;
  } else {
    d.children = d._children;
    d._children = null;
  }
}

function countDescendants(d) {
  let count = 0;
  function walk(node) {
    const children = node.children || node._children;
    if (children) {
      count += children.length;
      children.forEach(walk);
    }
  }
  walk(d);
  return count;
}

function expandAll(d) {
  if (d._children) {
    d.children = d._children;
    d._children = null;
  }
  if (d.children) d.children.forEach(expandAll);
}

function collapseAll(d) {
  if (d.children && d.depth >= 1) {
    d._children = d.children;
    d.children = null;
  }
  if (d.children) d.children.forEach(collapseAll);
  if (d._children) d._children.forEach(collapseAll);
}

function fitView() {
  const bounds = g.node().getBBox();
  const fullWidth = window.innerWidth;
  const fullHeight = window.innerHeight - 56;
  const bWidth = bounds.width;
  const bHeight = bounds.height;
  const scale = Math.min(0.9 * fullWidth / bWidth, 0.9 * fullHeight / bHeight, 1.5);
  const tx = fullWidth / 2 - scale * (bounds.x + bWidth / 2);
  const ty = fullHeight / 2 - scale * (bounds.y + bHeight / 2);

  svg.transition().duration(500)
    .call(zoom.transform, d3.zoomIdentity.translate(tx, ty).scale(scale));
}

// ─── PANEL ────────────────────────────────────────────────────────────────────
const panel = document.getElementById('panel');
const panelBody = document.getElementById('panel-body');

function showPanel(data) {
  let html = '';

  // Category badge
  html += `<div class="panel-category" style="background:${getCSSVar(getBgColor(data.category))};color:${getCSSVar(getColor(data.category))}">${data.category}</div>`;

  // Title
  html += `<div class="panel-title">${data.name}</div>`;

  // Description
  if (data.description) {
    html += `<div class="panel-subtitle">${data.description}</div>`;
  }

  // Content
  if (data.content) {
    html += `<div class="panel-section"><div class="panel-section-title">Overview</div><div class="panel-content"><p>${data.content}</p></div></div>`;
  }

  // Best Practices
  if (data.bestPractices && data.bestPractices.length) {
    html += `<div class="panel-section"><div class="panel-section-title">Best Practices</div><div class="panel-content"><ul>${data.bestPractices.map(bp => `<li>${bp}</li>`).join('')}</ul></div></div>`;
  }

  // Examples
  if (data.examples && data.examples.length) {
    html += `<div class="panel-section"><div class="panel-section-title">Examples</div><div class="panel-content"><ul>${data.examples.map(ex => `<li><code>${escapeHtml(ex)}</code></li>`).join('')}</ul></div></div>`;
  }

  // Attribution
  if (data.attribution) {
    html += `<div class="panel-section"><div class="panel-section-title">Source</div><div class="panel-content"><p>${data.attribution}</p></div></div>`;
  }

  // Tags
  if (data.tags && data.tags.length) {
    html += `<div class="panel-section"><div class="panel-section-title">Tags</div><div class="panel-tags">${data.tags.map(t => `<span class="panel-tag">${t}</span>`).join('')}</div></div>`;
  }

  // Links
  if (data.links && data.links.length) {
    html += `<div class="panel-section"><div class="panel-section-title">Links</div><div class="panel-content">${data.links.map(l => `<a class="panel-link" href="${l.url}" target="_blank" rel="noopener">&#x2197; ${l.label}</a>`).join('')}</div></div>`;
  }

  // Children list (if has collapsed children)
  if (data.children && data.children.length) {
    html += `<div class="panel-section"><div class="panel-section-title">Contains</div><div class="panel-content"><ul>${data.children.map(c => `<li><strong>${c.name}</strong>${c.description ? ' — ' + c.description : ''}</li>`).join('')}</ul></div></div>`;
  }

  panelBody.innerHTML = html;
  panel.classList.add('open');
}

function closePanel() {
  panel.classList.remove('open');
}

document.getElementById('panel-close').addEventListener('click', closePanel);

// ─── TOOLTIP ──────────────────────────────────────────────────────────────────
const tooltip = document.getElementById('tooltip');

function showTooltip(event, data) {
  tooltip.querySelector('.tooltip-title').textContent = data.name;
  tooltip.querySelector('.tooltip-desc').textContent = data.description || '';
  const hasChildren = data.children && data.children.length;
  tooltip.querySelector('.tooltip-hint').textContent = hasChildren ? 'Click to expand' : 'Click for details';
  tooltip.style.left = (event.pageX + 16) + 'px';
  tooltip.style.top = (event.pageY - 10) + 'px';
  tooltip.classList.add('visible');
}

function hideTooltip() {
  tooltip.classList.remove('visible');
}

// ─── SEARCH ───────────────────────────────────────────────────────────────────
const searchInput = document.getElementById('search');

searchInput.addEventListener('input', (e) => {
  currentSearch = e.target.value.toLowerCase().trim();
  if (!currentSearch) {
    clearSearch();
    return;
  }
  // Expand all to search through everything
  expandAll(root);
  update(root);
  setTimeout(() => applySearch(currentSearch), duration + 50);
});

function applySearch(query) {
  const allNodes = g.selectAll('g.node');
  const allLinks = g.selectAll('path.link');

  allNodes.classed('search-match', false).classed('search-dim', false);
  allLinks.classed('search-dim', false);

  if (!query) return;

  allNodes.each(function(d) {
    const data = d.data;
    const text = [data.name, data.description, data.content, ...(data.tags || []), ...(data.bestPractices || []), data.attribution || '']
      .join(' ').toLowerCase();
    const matches = text.includes(query);
    d3.select(this).classed('search-match', matches).classed('search-dim', !matches);
  });

  allLinks.classed('search-dim', true);
}

function clearSearch() {
  currentSearch = '';
  g.selectAll('g.node').classed('search-match', false).classed('search-dim', false);
  g.selectAll('path.link').classed('search-dim', false);
}

// ─── CONTROLS ─────────────────────────────────────────────────────────────────
document.getElementById('btn-expand-all').addEventListener('click', () => {
  expandAll(root);
  update(root);
  setTimeout(fitView, duration + 100);
});

document.getElementById('btn-collapse-all').addEventListener('click', () => {
  collapseAll(root);
  update(root);
  setTimeout(fitView, duration + 100);
});

document.getElementById('btn-fit').addEventListener('click', fitView);

// ─── KEYBOARD SHORTCUTS ──────────────────────────────────────────────────────
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    closePanel();
    searchInput.blur();
    if (currentSearch) {
      searchInput.value = '';
      clearSearch();
    }
  }
  if (e.key === '/' && document.activeElement !== searchInput) {
    e.preventDefault();
    searchInput.focus();
  }
  if (e.key === 'f' && document.activeElement !== searchInput) {
    e.preventDefault();
    fitView();
  }
});

// Close panel on background click
svg.on('click', () => closePanel());

// ─── RESPONSIVE ───────────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  update(root);
  fitView();
});

// ─── LAST UPDATED ─────────────────────────────────────────────────────────────
document.getElementById('last-updated').textContent = `Updated: ${LAST_UPDATED}`;

// ─── HELPER ───────────────────────────────────────────────────────────────────
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function getCSSVar(varStr) {
  // For inline styles, we need to resolve CSS custom properties
  // This is a workaround for use in JS-generated HTML
  return varStr;
}
</script>
