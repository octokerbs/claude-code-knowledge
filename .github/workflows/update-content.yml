name: Update Knowledge Content

on:
  schedule:
    # Runs every Monday at 9:00 UTC
    - cron: '0 9 * * 1'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest source content
        run: |
          mkdir -p .cache
          REPO_RAW="https://raw.githubusercontent.com/shanraisshan/claude-code-best-practice/main"

          # Fetch README
          curl -sL "${REPO_RAW}/README.md" -o .cache/README.md

          # Fetch best practice guides
          for file in subagent commands skills mcp settings memory cli-flags hooks; do
            curl -sL "${REPO_RAW}/best-practice/${file}.md" -o ".cache/bp-${file}.md" 2>/dev/null || true
          done

          # Fetch reports
          for file in agent-sdk-vs-cli browser-automation-mcp settings skills-monorepo agent-memory advanced-tool-use usage-rate-limits agents-commands-skills llm-degradation; do
            curl -sL "${REPO_RAW}/reports/${file}.md" -o ".cache/report-${file}.md" 2>/dev/null || true
          done

          echo "FETCH_DATE=$(date -Iseconds)" >> "$GITHUB_ENV"

      - name: Generate content snapshot
        run: |
          # Extract section headers and key data from README as a change-detection fingerprint
          grep -E "^#{1,3} |^\|.*\|$" .cache/README.md | head -200 > .cache/content-fingerprint.txt

          # Compare with last known fingerprint
          if [ -f content-fingerprint.txt ]; then
            if diff -q content-fingerprint.txt .cache/content-fingerprint.txt > /dev/null 2>&1; then
              echo "CONTENT_CHANGED=false" >> "$GITHUB_ENV"
              echo "No content changes detected."
            else
              echo "CONTENT_CHANGED=true" >> "$GITHUB_ENV"
              echo "Content changes detected!"
              diff content-fingerprint.txt .cache/content-fingerprint.txt || true
            fi
          else
            echo "CONTENT_CHANGED=true" >> "$GITHUB_ENV"
            echo "First run — no previous fingerprint."
          fi

          # Always update the fingerprint
          cp .cache/content-fingerprint.txt content-fingerprint.txt

      - name: Update last-fetched date in index.html
        if: env.CONTENT_CHANGED == 'true'
        run: |
          TODAY=$(date +%Y-%m-%d)
          sed -i "s/const LAST_UPDATED = \"[^\"]*\"/const LAST_UPDATED = \"${TODAY}\"/" index.html

      - name: Store fetched content for reference
        if: env.CONTENT_CHANGED == 'true'
        run: |
          mkdir -p .cache
          # .cache is gitignored but we keep the fingerprint tracked
          echo "Last fetched: ${{ env.FETCH_DATE }}" > LAST_FETCH.md
          echo "" >> LAST_FETCH.md
          echo "Source: https://github.com/shanraisshan/claude-code-best-practice" >> LAST_FETCH.md
          echo "" >> LAST_FETCH.md
          echo "## Detected Sections" >> LAST_FETCH.md
          grep -E "^#{1,3} " .cache/README.md >> LAST_FETCH.md || true

      - name: Create Pull Request
        if: env.CONTENT_CHANGED == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update content fingerprint (${{ env.FETCH_DATE }})"
          title: "📚 New content detected in source repo"
          body: |
            The weekly content check found changes in [claude-code-best-practice](https://github.com/shanraisshan/claude-code-best-practice).

            **What changed:** The README structure or content has been updated since last check.

            **Next steps:**
            1. Review the [source repo](https://github.com/shanraisshan/claude-code-best-practice) for new tips, concepts, or workflows
            2. Update `KNOWLEDGE_DATA` in `index.html` with any new items
            3. Merge this PR to update the fingerprint and last-fetched date

            _Automated by the weekly content update workflow._
          branch: content-update
          delete-branch: true
